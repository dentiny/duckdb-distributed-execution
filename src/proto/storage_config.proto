syntax = "proto3";

package duckdb.distributed;

message InMemoryStorage {}

message LocalStorage {
  // Absolute directory visible at the same path to the control node and all workers.
  string root = 1;
}

enum S3UrlStyle {
  S3_URL_STYLE_UNSPECIFIED = 0;
  S3_URL_STYLE_PATH = 1;
  S3_URL_STYLE_VHOST = 2;
}

message S3Storage {
  string bucket = 1;
  // Key prefix inside the bucket.
  string root = 2;
  string endpoint = 3;
  string region = 4;
  string key_id = 5;
  string secret = 6;
  string session_token = 7;
  optional bool use_ssl = 8;
  S3UrlStyle url_style = 9;
}

// Object storage database selected by a client attachment. Each distinct database and storage location is opened as
// its own DuckDB instance on the control node and on every worker; credentials initialize but do not identify it.
message StorageConfig {
  // DuckDB database URI using duckdb_objfs://. An entirely empty configuration selects the server's default
  // in-memory database.
  string database_uri = 1;

  oneof storage {
    InMemoryStorage in_memory = 2;
    LocalStorage local = 3;
    S3Storage s3 = 4;
  }
}
