syntax = "proto3";

package duckdb.distributed;

enum TransactionAction {
  TRANSACTION_ACTION_UNSPECIFIED = 0;
  TRANSACTION_ACTION_BEGIN = 1;
  TRANSACTION_ACTION_COMMIT = 2;
  TRANSACTION_ACTION_ROLLBACK = 3;
}

enum TransactionStatus {
  TRANSACTION_STATUS_UNSPECIFIED = 0;
  TRANSACTION_STATUS_ACTIVE = 1;
  TRANSACTION_STATUS_COMMITTED = 2;
  TRANSACTION_STATUS_ROLLED_BACK = 3;
  TRANSACTION_STATUS_UNKNOWN = 4;
}

message TransactionRequest {
  TransactionAction action = 1;
}

message TransactionResponse {
  TransactionStatus status = 1;
}
