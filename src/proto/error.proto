syntax = "proto3";

package duckdb.distributed;

// Mirrors DuckDB's ExceptionType values at the protocol boundary.
enum RemoteExceptionType {
  REMOTE_EXCEPTION_INVALID = 0;
  REMOTE_EXCEPTION_OUT_OF_RANGE = 1;
  REMOTE_EXCEPTION_CONVERSION = 2;
  REMOTE_EXCEPTION_UNKNOWN_TYPE = 3;
  REMOTE_EXCEPTION_DECIMAL = 4;
  REMOTE_EXCEPTION_MISMATCH_TYPE = 5;
  REMOTE_EXCEPTION_DIVIDE_BY_ZERO = 6;
  REMOTE_EXCEPTION_OBJECT_SIZE = 7;
  REMOTE_EXCEPTION_INVALID_TYPE = 8;
  REMOTE_EXCEPTION_SERIALIZATION = 9;
  REMOTE_EXCEPTION_TRANSACTION = 10;
  REMOTE_EXCEPTION_NOT_IMPLEMENTED = 11;
  REMOTE_EXCEPTION_EXPRESSION = 12;
  REMOTE_EXCEPTION_CATALOG = 13;
  REMOTE_EXCEPTION_PARSER = 14;
  REMOTE_EXCEPTION_PLANNER = 15;
  REMOTE_EXCEPTION_SCHEDULER = 16;
  REMOTE_EXCEPTION_EXECUTOR = 17;
  REMOTE_EXCEPTION_CONSTRAINT = 18;
  REMOTE_EXCEPTION_INDEX = 19;
  REMOTE_EXCEPTION_STAT = 20;
  REMOTE_EXCEPTION_CONNECTION = 21;
  REMOTE_EXCEPTION_SYNTAX = 22;
  REMOTE_EXCEPTION_SETTINGS = 23;
  REMOTE_EXCEPTION_BINDER = 24;
  REMOTE_EXCEPTION_NETWORK = 25;
  REMOTE_EXCEPTION_OPTIMIZER = 26;
  REMOTE_EXCEPTION_NULL_POINTER = 27;
  REMOTE_EXCEPTION_IO = 28;
  REMOTE_EXCEPTION_INTERRUPT = 29;
  REMOTE_EXCEPTION_FATAL = 30;
  REMOTE_EXCEPTION_INTERNAL = 31;
  REMOTE_EXCEPTION_INVALID_INPUT = 32;
  REMOTE_EXCEPTION_OUT_OF_MEMORY = 33;
  REMOTE_EXCEPTION_PERMISSION = 34;
  REMOTE_EXCEPTION_PARAMETER_NOT_RESOLVED = 35;
  REMOTE_EXCEPTION_PARAMETER_NOT_ALLOWED = 36;
  REMOTE_EXCEPTION_DEPENDENCY = 37;
  REMOTE_EXCEPTION_HTTP = 38;
  REMOTE_EXCEPTION_MISSING_EXTENSION = 39;
  REMOTE_EXCEPTION_AUTOLOAD = 40;
  REMOTE_EXCEPTION_SEQUENCE = 41;
  REMOTE_EXCEPTION_INVALID_CONFIGURATION = 42;
}

message RemoteError {
  RemoteExceptionType exception_type = 1;
  string message = 2;
  map<string, string> extra_info = 3;
}
