#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-submodule-version:
    uses: duckdb/extension-ci-tools/.github/workflows/_submodule_version.yml@9b1020499dc85966be3342541f98c8e8e4aada89

  duckdb-stable-build:
    name: Build extension binaries
    needs: duckdb-submodule-version
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@9b1020499dc85966be3342541f98c8e8e4aada89
    with:
      duckdb_version: ${{ needs.duckdb-submodule-version.outputs.version }}
      ci_tools_version: 9b1020499dc85966be3342541f98c8e8e4aada89
      extension_name: duckherder

  code-quality-check:
    name: Code Quality Check
    needs: duckdb-submodule-version
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@9b1020499dc85966be3342541f98c8e8e4aada89
    with:
      duckdb_version: ${{ needs.duckdb-submodule-version.outputs.version }}
      ci_tools_version: 9b1020499dc85966be3342541f98c8e8e4aada89
      extension_name: duckherder
      format_checks: 'format;tidy'
